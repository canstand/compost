# -- Site Configuration --

# baseURL = "https://your_domain.com/"
title = "Compost"

locale = "en"
defaultContentLanguage = "en"
hasCJKLanguage = false # true for Chinese/Japanese/Korean
defaultContentLanguageInSubdir = false

# copyright = "Copy, _right?_ :thinking_face:"

enableEmoji = true
enableRobotsTXT = true

# Uncomment for analytics
# googleAnalytics = "G-MEASUREMENT_ID"

# Hugo writes hugo_stats.json, which is the content source for Tailwind CSS.
# See assets/css/main.css.
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.(js|mjs|cjs)'
    target = 'css'
  [[build.cachebusters]]
    source = 'assets/.*\.(js|ts|jsx|tsx)'
    target = 'js'
  [[build.cachebusters]]
    source = 'assets/.*\.(.*)$'
    target = '$1'

[minify]
[minify.tdewolff]
[minify.tdewolff.html]
# improve seo
keepQuotes = true
